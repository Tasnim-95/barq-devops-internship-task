name: barq-assessment
x-app: &app
  build: .
  init: true
  restart: unless-stopped
  mem_limit: 256m
  cpus: "0.50"
  env_file: ./.env
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    APP_MESSAGE: "Welcome to BARQ Systems"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 3s
  networks: [frontend, backend]
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.00"
    environment:
      POSTGRES_USER: barq_app
      POSTGRES_DB: barq_tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barq_app -d barq_tasks"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [backend]
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: redis
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks: [backend]
    volumes:
      - redis-data:/data
  app-01:
    <<: *app
    container_name: app-01
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      INSTANCE_ID: "app-02"
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: nginx
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    depends_on:
      app-01:
        condition: service_healthy
      app-02:
        condition: service_healthy
    networks: [frontend]
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
  redis-data:
